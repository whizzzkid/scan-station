name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""
          - "--features all-backends"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.features }}

      - name: Build and test
        env:
          FEATURES: ${{ matrix.features }}
        run: |
          cargo build --workspace ${FEATURES}
          cargo test --workspace ${FEATURES}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain with clippy and rustfmt
        run: rustup toolchain install stable --profile minimal --component clippy rustfmt

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --workspace -- -D warnings

      - name: Clippy (all backends)
        run: cargo clippy --workspace --features all-backends -- -D warnings

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: scan-station:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify binaries exist and run
        run: |
          echo "=== scan-station --help ==="
          docker run --rm scan-station:test scan-station --help

          echo "=== discover-scanner --help ==="
          docker run --rm scan-station:test discover-scanner --help

          echo "=== scan-station validate (no config, defaults) ==="
          docker run --rm scan-station:test scan-station validate

          echo "=== Check binary sizes ==="
          docker run --rm scan-station:test sh -c 'ls -lh /usr/local/bin/scan-station /usr/local/bin/discover-scanner'

          echo "=== Check sane-scan-pdf exists ==="
          docker run --rm scan-station:test test -f /app/sane-scan-pdf/scan

          echo "=== Check scanbd trigger script ==="
          docker run --rm scan-station:test cat /etc/scanbd/scripts/scan-station

          echo "=== Check image size ==="
          docker images scan-station:test --format '{{.Size}}'
