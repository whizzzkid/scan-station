name: Release Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux)
        if: runner.os == 'Linux'
        run: cargo install cross --locked

      - name: Build scan-station (Linux)
        if: runner.os == 'Linux'
        run: cross build --release --target ${{ matrix.target }} -p scan-station --features all-backends

      - name: Build discover-scanner (Linux)
        if: runner.os == 'Linux'
        run: cross build --release --target ${{ matrix.target }} -p discover-scanner

      - name: Build scan-station (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --target ${{ matrix.target }} -p scan-station --features all-backends

      - name: Build discover-scanner (macOS)
        if: runner.os == 'macOS'
        run: cargo build --release --target ${{ matrix.target }} -p discover-scanner

      - name: Package binaries
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          cd "target/${TARGET}/release"
          tar czf "${GITHUB_WORKSPACE}/scan-station-${SUFFIX}.tar.gz" scan-station discover-scanner

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scan-station-${{ matrix.suffix }}
          path: scan-station-${{ matrix.suffix }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "**/*.tar.gz"
          generate_release_notes: true
