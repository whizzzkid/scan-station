global {
    debug   = true
    debug-level = 2
    user    = root
    group   = root
    saned   = "/usr/sbin/saned"
    saned_opt  = {}
    saned_env  = { "SANE_CONFIG_DIR=/etc/scanbd" }
    scriptdir = /etc/scanbd/scripts
    timeout = 500
    pidfile = "/var/run/scanbd.pid"

    environment {
        device = "SCANBD_DEVICE"
        action = "SCANBD_ACTION"
    }

    action scan {
        filter = "^scan.*"
        numerical-trigger {
            from-value = 1
            to-value   = 0
        }
        desc   = "Scan button pressed"
        script = "scan-station"
    }
}
