# scan-station configuration
#
# Mount this file into Docker at /etc/scan-station/config.toml
# Secrets use ${ENV_VAR} syntax, resolved from environment at runtime.

[scan]
vendor = "fujitsu"
dpi = 300
mode = "Color"
file_prefix = "scan"
date_format = "%Y-%m-%d-%H%M%S-%3f-%Z"
scan_program = "/app/sane-scan-pdf/scan"
tmp_dir = "/tmp/scan-station"

# --- BACKENDS ---
# Each [[backends]] entry is an active upload target.
# Remove or comment out a section to disable that backend.
# You can have multiple instances of the same type.

[[backends]]
type = "filesystem"
path = "/scans"

# Uncomment to enable Papra uploads:
